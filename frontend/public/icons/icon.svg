<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  
  <!-- Neural Network Connections -->
  <g stroke="url(#grad)" stroke-width="8" opacity="0.4">
    <line x1="150" y1="170" x2="256" y2="120" />
    <line x1="362" y1="170" x2="256" y2="120" />
    <line x1="150" y1="170" x2="256" y2="280" />
    <line x1="362" y1="170" x2="256" y2="280" />
    <line x1="180" y1="380" x2="256" y2="280" />
    <line x1="332" y1="380" x2="256" y2="280" />
    <line x1="180" y1="380" x2="332" y2="380" />
  </g>

  <!-- Network Nodes with Glow -->
  <circle cx="256" cy="120" r="28" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="150" cy="170" r="22" fill="#38bdf8"/>
  <circle cx="362" cy="170" r="22" fill="#818cf8"/>
  <circle cx="256" cy="280" r="38" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="180" cy="380" r="24" fill="#a855f7"/>
  <circle cx="332" cy="380" r="24" fill="#6366f1"/>

  <!-- Center N monogram badge -->
  <path d="M236 250 L236 310 L256 275 L256 310" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M256 250 L276 285 L276 250" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
