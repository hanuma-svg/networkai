<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetworkAI Assistant</title>
    <style>
      body {
        width: 320px;
        min-height: 240px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        box-sizing: border-box;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 600;
        background-color: #dbeafe;
        color: #1e40af;
        border-radius: 9999px;
        margin-bottom: 8px;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 18px;
      }
      p {
        font-size: 13px;
        color: #64748b;
        margin: 0 0 16px 0;
      }
      .status {
        font-size: 12px;
        padding: 8px 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="badge">NetworkAI</div>
    <h2>Assistant</h2>
    <p>AI networking co-pilot ready for action queue and drafting.</p>
    <div id="status" class="status">Connecting to LinkedIn...</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
